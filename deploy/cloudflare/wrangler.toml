# Деплой: make cf-deploy. Статику отдаёт Static Assets, Go получает только run_worker_first.
name = "expense-bot"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[assets]
directory = "../../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/healthz"]

[ai]
binding = "AI"

[vars]
APP_TIMEZONE = "Europe/Moscow"
TELEGRAM_MODE = "webhook"
LLM_PROVIDER = "workersai"
LLM_MODEL = "@cf/google/gemma-4-26b-a4b-it"
LLM_EXTRA_BODY = '{"chat_template_kwargs":{"enable_thinking":false}}'
BOT_MESSAGES_PER_USER_PER_DAY = "100"
# Gemma 4: 4–8 нейронов на сообщение, квота 10 000 в день.
LLM_CALLS_PER_DAY = "1000"
BOT_MAX_MESSAGE_LENGTH = "500"
ADMIN_LOGIN_ATTEMPTS_PER_HOUR = "10"

# Секреты — make cf-secrets. Блок [[d1_databases]] дописывает build_config.sh.
