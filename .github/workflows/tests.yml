name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: golangci-lint (server and worker)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$RUNNER_TEMP/bin/golangci-lint" run ./...
          GOOS=js GOARCH=wasm "$RUNNER_TEMP/bin/golangci-lint" run ./cmd/worker ./internal/agent/clients/llm
      - name: tests
        run: go test -count=1 ./...
      - name: worker builds with TinyGo and fits the free plan (3 MB gzip)
        run: |
          curl -sL https://github.com/tinygo-org/tinygo/releases/download/v0.42.0/tinygo0.42.0.linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/tinygo/bin/tinygo" build -o app.wasm -target wasm -no-debug ./cmd/worker
          size=$(gzip -9 -c app.wasm | wc -c)
          echo "worker gzip: $size bytes"
          test "$size" -lt 3145728

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
