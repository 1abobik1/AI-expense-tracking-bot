services:
  app:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/expenses.db
      HTTP_ADDR: ":8080"
    volumes:
      - data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
